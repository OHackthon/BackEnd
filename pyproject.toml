[project]
name = "BackEnd"
version = "0.1.0"
description = "Default template for PDM package"
authors = [{ name = "renato-chagas", email = "renatochagas.m@gmail.com" }]
dependencies = [
    "django>=5.2.8",
    "djangorestframework>=3.16.1",
    "django-cors-headers>=4.9.0",
    "Pillow>=12.0.0",
    "djangorestframework-simplejwt>=5.5.1",
    "pandas>=2.3.3",
    "openpyxl>=3.1.5",
    "cloudinary>=1.44.1",
    "django-cloudinary-storage>=0.3.0",
    "python-dotenv>=1.2.1",
    "dj-database-url>=2.1.0",
    "gunicorn>=21.2.0",
    "psycopg2-binary>=2.9.9",
]
requires-python = "==3.12.*"
readme = "README.md"
license = { text = "MIT" }


[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "python src/manage.py runserver"
createsuperuser = "python src/manage.py createsuperuser"
pre_migrate = "python src/manage.py makemigrations"
migrate = "python src/manage.py migrate"
post_migrate = "python src/manage.py graph_models -g -o core.png core"
shell = "python src/manage.py shell"
